<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English P.5 Term 1 - Fun Learning 16 Weeks</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00796b; /* Teal */
            --primary-accent: #f4511e; /* Deep Orange */
            --primary-orange: #ff9800;
            --soft-bg: #e0f2f1; /* Very light teal */
            --font-main: 'Mali', cursive;
            --success-green: #2e7d32;
            --header-color: #004d40;
            --card-border: #26a69a;
            --card-bg: #b2dfdb;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--soft-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background: linear-gradient(180deg, #b2dfdb, #e0f2f1);
            padding: 20px;
            text-align: center;
            border-bottom: 6px dashed var(--primary-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        .score-panel {
            background: white;
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            border: 3px solid var(--primary-color);
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 10px;
        }

        .author-text {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            color: #424242;
            font-weight: bold;
        }

        .week-selector {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 5px;
            margin-bottom: 20px;
            scrollbar-width: thin;
        }

        .week-btn {
            background: white;
            border: 2px solid var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-family: var(--font-main);
            transition: 0.3s;
            color: var(--primary-color);
            font-weight: bold;
        }

        .week-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .content-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 3px solid var(--primary-color);
        }

        .unit-tag {
            background: var(--primary-accent);
            color: white;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .lesson-box {
            background: #ffffff;
            border: 2px solid var(--card-border);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        .lesson-box:hover { transform: translateY(-5px); background: var(--card-bg); }
        .lesson-box.viewed { background: #fff3e0; border-color: var(--primary-orange); }

        .big-text { font-size: 1.3rem; display: block; margin-bottom: 5px; color: var(--header-color); font-weight: bold; line-height: 1.3; }
        .sub-text { font-size: 0.85rem; color: #555; line-height: 1.2; }

        .quiz-area {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .start-btn {
            background: var(--success-green);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: var(--font-main);
            box-shadow: 0 4px 0 #1b5e20;
        }

        .start-btn:disabled { background: #ccc; box-shadow: 0 4px 0 #999; cursor: not-allowed; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
        }

        .option-btn {
            background: #f5f5f5;
            border: 2px solid #ddd;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 15px;
            font-size: 1.1rem;
            font-family: var(--font-main);
            cursor: pointer;
        }

        .option-btn:hover { background: var(--soft-bg); border-color: var(--primary-color); }

        .progress-bar {
            background: #eee;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-inner {
            background: var(--success-green);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0; color: var(--header-color);">🇬🇧 Fun English P.5 (เทอม 1)</h1>
    <p class="author-text">พัฒนาบทเรียนโดย อาจารย์วุฒิชัย (Ajarn Wutthichai)</p>
    <div class="score-panel">⭐ คะแนนสะสม: <span id="userScore">0</span></div>
</header>

<div class="container">
    <div class="week-selector" id="weekBar"></div>

    <div class="content-card">
        <div id="unitDisplay" class="unit-tag"></div>
        <h2 id="chapterTitle">กำลังโหลด...</h2>
        <p id="chapterDesc" style="color: #666;"></p>
        
        <div class="lesson-grid" id="lessonItems"></div>

        <div class="quiz-area">
            <button id="quizBtn" class="start-btn" onclick="startQuiz()" disabled>📝 ทำแบบทดสอบ</button>
            <p id="quizHint" style="font-size: 0.9rem; color: #d32f2f; margin-top: 10px;">กรุณาคลิกฟังคำศัพท์ให้ครบทุกคำก่อนเริ่มทำแบบทดสอบครับ</p>
        </div>
    </div>
</div>

<div id="quizModal" class="modal">
    <div class="modal-content">
        <div class="progress-bar"><div id="progBar" class="progress-inner"></div></div>
        <h3 id="qNum" style="color: var(--primary-accent);"></h3>
        <h2 id="qText" style="white-space: pre-line;"></h2>
        <div id="options"></div>
    </div>
</div>

<script>
    const data = [

            items: [
                {t:"Sweep 🧹", s:"Sweep the floor กวาดพื้น"}, {t:"Mop 🪣", s:"Mop the floor ถูพื้น"}, 
                {t:"Dishes 🍽️", s:"Wash the dishes ล้างจาน"}, {t:"Laundry 🧺", s:"Do the laundry ซักผ้า"},

                {q: "วาฬ (Whale) เป็นสัตว์ที่ 'ใหญ่ที่สุด' ในมหาสมุทร ใช้คำใด?", a: "The biggest", o: ["The tallest", "The biggest", "The smallest", "Bigger"]}
            ]
        }
    ];

    let currentWeek = 0;
    let score = 0;
    let viewedItems = new Set();
    let currentQuizIndex = 0;

    function init() {
        const bar = document.getElementById('weekBar');
        bar.innerHTML = '';
        data.forEach((w, i) => {
            const b = document.createElement('button');
            b.className = 'week-btn' + (i === 0 ? ' active' : '');
            b.innerText = 'สัปดาห์ที่ ' + (i + 1);
            b.onclick = () => switchWeek(i);
            bar.appendChild(b);
        });
        loadWeek(0);
    }

    function switchWeek(idx) {
        currentWeek = idx;
        viewedItems.clear();
        document.querySelectorAll('.week-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        loadWeek(idx);
    }

    function loadWeek(idx) {
        const w = data[idx];
        document.getElementById('unitDisplay').innerText = w.unit;
        document.getElementById('chapterTitle').innerText = w.title;
        document.getElementById('chapterDesc').innerText = w.desc;
        
        const grid = document.getElementById('lessonItems');
        grid.innerHTML = '';
        w.items.forEach((item, i) => {
            const box = document.createElement('div');
            box.className = 'lesson-box';
            box.innerHTML = `<span class="big-text">${item.t}</span><span class="sub-text">คลิกเพื่อฟังเสียง</span>`;
            box.onclick = () => {
                speak(item.s);
                box.classList.add('viewed');
                viewedItems.add(i);
                checkReady();
            };
            grid.appendChild(box);
        });
        checkReady();
    }

    function checkReady() {
        const ready = viewedItems.size >= data[currentWeek].items.length;
        document.getElementById('quizBtn').disabled = !ready;
        document.getElementById('quizHint').style.display = ready ? 'none' : 'block';
    }

    // ฟังก์ชันอ่านออกเสียงภาษาอังกฤษและไทยแบบแยกสำเนียงและความเร็ว
    function speak(txt) {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel(); 
        
        // แยกข้อความภาษาอังกฤษที่อยู่ด้านหน้า และข้อความภาษาไทยที่อยู่ด้านหลัง
        const engPartMatch = txt.match(/^[^ก-๙]+/);
        const thaiPartMatch = txt.match(/[ก-๙].*/);

        if (engPartMatch && thaiPartMatch && engPartMatch[0].trim().length > 0) {
            // อ่านภาษาอังกฤษช้าๆ ชัดๆ (0.5)
            const uEng = new SpeechSynthesisUtterance(engPartMatch[0].trim());
            uEng.lang = 'en-US'; 
            uEng.rate = 0.5; 
            
            // อ่านคำแปลภาษาไทย ความเร็วปกติ
            const uThai = new SpeechSynthesisUtterance(thaiPartMatch[0].trim());
            uThai.lang = 'th-TH';
            uThai.rate = 0.9; 

            speechSynthesis.speak(uEng);
            speechSynthesis.speak(uThai);
        } else {
            const u = new SpeechSynthesisUtterance(txt);
            if (!/[ก-๙]/.test(txt)) {
                u.lang = 'en-US';
                u.rate = 0.5;
            } else {
                u.lang = 'th-TH'; 
                u.rate = 0.85; 
            }
            speechSynthesis.speak(u);
        }
    }

    function startQuiz() {
        currentQuizIndex = 0;
        document.getElementById('quizModal').style.display = 'flex';
        showQuestion();
    }

    function showQuestion() {
        const qData = data[currentWeek].quiz[currentQuizIndex];
        const total = data[currentWeek].quiz.length;
        
        document.getElementById('qNum').innerText = `ข้อที่ ${currentQuizIndex + 1} / ${total}`;
        document.getElementById('qText').innerText = qData.q;
        document.getElementById('progBar').style.width = (currentQuizIndex / total * 100) + '%';
        
        const opts = document.getElementById('options');
        opts.innerHTML = '';
        qData.o.forEach(o => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = o;
            btn.onclick = () => handleAnswer(o, qData.a);
            opts.appendChild(btn);
        });
        
        // อ่านคำถาม
        speak(qData.q);
    }

    function handleAnswer(ans, correct) {
        if (ans === correct) {
            score += 10;
            document.getElementById('userScore').innerText = score;
            speak("Correct ถูกต้องครับ เก่งมาก");
        } else {
            speak("Try again ลองใหม่อีกนิดนะครับ");
        }

        currentQuizIndex++;
        if (currentQuizIndex < data[currentWeek].quiz.length) {
            setTimeout(showQuestion, 2000);
        } else {
            setTimeout(() => {
                document.getElementById('progBar').style.width = '100%';
                document.getElementById('qNum').innerText = "🎉 ยินดีด้วย!";
                document.getElementById('qText').innerText = `จบการเรียนสัปดาห์ที่ ${currentWeek+1}!\nคะแนนสะสมรวม: ${score} คะแนน`;
                
                const opts = document.getElementById('options');
                opts.innerHTML = '';
                const closeBtn = document.createElement('button');
                closeBtn.className = 'start-btn';
                closeBtn.innerText = 'ปิดหน้าต่าง';
                closeBtn.onclick = () => document.getElementById('quizModal').style.display = 'none';
                opts.appendChild(closeBtn);
                
                speak("Very good เก่งมากครับ ทำแบบทดสอบครบแล้ว");
            }, 1000);
        }
    }

    window.onload = init;
</script>
</body>
</html>
